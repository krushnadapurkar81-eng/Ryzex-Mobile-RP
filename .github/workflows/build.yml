name: Build SA-MP Gamemode

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pawn Compiler
        run: |
          git clone https://github.com/pawn-lang/compiler.git
          cd compiler
          cmake .
          make
          sudo cp pawncc /usr/local/bin/

      - name: Compile Gamemode
        run: |
          pawncc gamemodes/gamemode.pwn \
          -igamemodes \
          -iinclude \
          -ogamemodes/gamemode.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: gamemode
          path: gamemodes/gamemode.amx
