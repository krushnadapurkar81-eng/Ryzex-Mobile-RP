name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Pawn Compiler
        run: |
          wget https://github.com/pawn-lang/compiler/releases/latest/download/pawnc-linux-x86_64.tar.gz
          tar -xzf pawnc-linux-x86_64.tar.gz

      - name: Compile Gamemode
        run: |
          ./pawncc \
          gamemodes/gamemode.pwn \
          -iinclude \
          -ilegacy \
          -ogamemodes/gamemode.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: gamemode
          path: gamemodes/gamemode.amx
