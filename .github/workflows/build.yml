name: Build SA-MP Gamemode

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pawn Compiler
        run: |
          sudo apt update
          sudo apt install -y unzip wget
          wget https://github.com/compuphase/pawn/releases/download/v3.10.10/pawnc_linux_x86.zip
          unzip pawnc_linux_x86.zip
          chmod +x pawncc

      - name: Compile Gamemode
        run: |
          ./pawncc gamemodes/gamemode.pwn -ilegacy

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: gamemode-amx
          path: gamemode.amx
