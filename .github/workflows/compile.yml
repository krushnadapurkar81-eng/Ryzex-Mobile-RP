name: Compile SP-RP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y git cmake make gcc g++

      - name: Clone Pawn Compiler
        run: |
          git clone --depth=1 https://github.com/pawn-lang/compiler.git pawn-compiler

      - name: Inspect Source
        run: |
          cd pawn-compiler
          echo "=== ROOT ==="
          pwd
          ls -la
          echo ""
          echo "=== SOURCE ==="
          ls -la source
          echo ""
          echo "=== FIND CMakeLists ==="
          find . -name CMakeLists.txt

      - name: Finish
        run: |
          echo "Inspection complete."
