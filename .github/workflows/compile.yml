name: Build Ryzex Mobile RP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git cmake make clang

      - name: Clone Pawn compiler
        run: |
          git clone https://github.com/compuphase/pawn.git

      - name: Build compiler
        run: |
          cd pawn/source/compiler
          mkdir build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Show compiler
        run: |
          ls -la pawn/source/compiler/build
