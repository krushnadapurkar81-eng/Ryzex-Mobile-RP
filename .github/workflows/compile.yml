name: Build Ryzex Mobile RP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y curl unzip git

      - name: Install sampctl
        run: |
          curl -L https://github.com/Southclaws/sampctl/releases/latest/download/sampctl-linux-amd64.tar.gz \
            | tar -xz
          sudo mv sampctl /usr/local/bin/
          sampctl version

      - name: Install dependencies
        run: |
          sampctl ensure

      - name: Build gamemode
        run: |
          sampctl package build

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: gamemode
          path: gamemodes/*.amx
