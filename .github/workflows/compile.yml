name: Compile SP-RP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake make g++ build-essential

      - name: Clone Pawn Compiler
        run: |
          git clone --depth=1 https://github.com/pawn-lang/compiler pawn-compiler

      - name: Build Pawn Compiler
        run: |
          cd pawn-compiler/source/compiler
          mkdir build
          cd build
          cmake ..
          make -j2

      - name: Find pawncc
        run: |
          find $GITHUB_WORKSPACE -type f -name pawncc

      - name: Compile Gamemode
        run: |
          PAWNCC=$(find $GITHUB_WORKSPACE -type f -name pawncc | head -n1)

          echo "PawnCC: $PAWNCC"

          chmod +x "$PAWNCC"

          cd gamemodes

          "$PAWNCC" gamemode.pwn \
            -i./ \
            -i./config \
            -i./config/data \
            -i./config/gui \
            -i./config/utils \
            -i../pawno/include \
            -ogamemode.amx

      - name: Verify Output
        run: |
          ls -lah gamemodes

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: gamemode-amx
          path: gamemodes/gamemode.amx
