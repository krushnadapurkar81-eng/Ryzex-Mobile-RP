name: Compile SP-RP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git cmake build-essential unzip wget

      - name: Clone Pawn Compiler
        run: |
          git clone --depth=1 https://github.com/pawn-lang/compiler.git
          cd compiler/source/compiler
          mkdir build
          cd build
          cmake ..
          make

      - name: Find pawncc
        run: |
          find . -name pawncc

      - name: Compile Gamemode
        run: |
          PAWNCC=$(find . -type f -name pawncc | head -n1)
          chmod +x "$PAWNCC"

          "$PAWNCC" \
            gamemodes/gamemode.pwn \
            -igamemodes \
            -igamemodes/config \
            -ogamemode.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: gamemode
          path: gamemode.amx
          
