name: Compile SP-RP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git cmake make gcc g++ clang

      - name: Clone Pawn Compiler
        run: |
          git clone --depth=1 https://github.com/pawn-lang/compiler.git pawn-compiler

      - name: Build Pawn Compiler
        run: |
          cd pawn-compiler
          mkdir build
          cd build
          cmake ..
          make -j2

      - name: Check compiler
        run: |
          find pawn-compiler -name pawncc

      - name: Compile Gamemode
        run: |
          PAWNCC=$(find pawn-compiler -name pawncc | head -n1)
          chmod +x "$PAWNCC"
          "$PAWNCC" gamemodes/gamemode.pwn \
            -ilegacy \
            -ogamemodes/gamemode.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: gamemode
          path: gamemodes/gamemode.amx
