name: Compile SP-RP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git cmake make g++ build-essential

      - name: Clone Pawn Compiler
        run: |
          git clone --depth=1 https://github.com/pawn-lang/compiler pawn-compiler

      - name: Build Pawn Compiler
        run: |
          cd pawn-compiler/source/compiler
          mkdir build
          cd build
          cmake ..
          make -j2

      - name: Find pawncc
        run: |
          find ../../.. -name pawncc

      - name: Finish
        run: echo "Done"
