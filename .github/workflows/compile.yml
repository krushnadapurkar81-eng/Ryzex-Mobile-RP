name: Compile SP-RP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Download Pawn Compiler
        run: |
          wget https://github.com/pawn-lang/compiler/releases/latest/download/pawnc-linux-x86_64.zip -O pawnc.zip
          unzip pawnc.zip -d pawn
          chmod +x pawn/pawncc

      - name: Compile Gamemode
        run: |
          cd gamemodes

          ../pawn/pawncc gamemode.pwn \
            -i./ \
            -i./config \
            -i./config/data \
            -i./config/gui \
            -i./config/utils \
            -i../pawno/include \
            -ogamemode.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: gamemode-amx
          path: gamemodes/gamemode.amx
          
