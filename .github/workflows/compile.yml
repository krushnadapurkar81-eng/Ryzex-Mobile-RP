name: Build Ryzex Mobile RP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential cmake make gcc g++

      - name: Clone Pawn compiler
        run: |
          git clone https://github.com/compuphase/pawn.git

      - name: Show Pawn repo
        run: |
          echo "===== ROOT ====="
          ls -la
          echo ""
          echo "===== PAWN ====="
          ls -R pawn
