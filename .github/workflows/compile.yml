name: Compile SP-RP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pawn Compiler
        run: |
          sudo apt update
          sudo apt install -y pawnc

      - name: Compile Gamemode
        run: |
          pawncc gamemodes/gamemode.pwn \
            -ilegacy \
            -ogamemodes/gamemode.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: gamemode
          path: gamemodes/gamemode.amx
