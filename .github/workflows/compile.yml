name: Compile SP-RP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt update
          sudo apt install -y git cmake make gcc g++

      - name: Clone Pawn Compiler
        run: |
          git clone --depth=1 https://github.com/pawn-lang/compiler pawn-compiler

      - name: Build Pawn Compiler
        run: |
          cd pawn-compiler/source/compiler
          mkdir build
          cd build
          cmake ..
          make -j1 || true

      - name: Find pawncc
        run: |
          find $GITHUB_WORKSPACE -name pawncc
          find $GITHUB_WORKSPACE -name pawnc
