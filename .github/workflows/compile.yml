name: Compile SP-RP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y git cmake make gcc g++ clang

      - name: Clone Pawn Compiler
        run: |
          git clone --depth=1 https://github.com/pawn-lang/compiler.git pawn-compiler

      - name: Inspect Pawn Compiler
        run: |
          cd pawn-compiler
          echo "Current directory:"
          pwd
          echo ""
          echo "Files:"
          ls -la
          echo ""
          echo "Tree:"
          find . -maxdepth 2 -type f

      - name: Finish
        run: echo "Inspection complete"
